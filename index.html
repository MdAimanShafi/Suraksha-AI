    <meta name="description" content="Multilingual industrial factory safety companion providing voice-guided PPE, fire, machine LOTO, electrical, and emergency protocols with shopfloor kiosk mode and supervisor safety analytics." />

  </head>
  <body class="bg-slate-900 text-slate-100 antialiased selection:bg-orange-500 selection:text-white">
    <script>
      // In AI Studio preview environment, HMR WebSocket is disabled
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          (typeof e.reason === 'string'
            ? e.reason.includes('WebSocket')
            : e.reason.message?.includes('WebSocket') || e.reason.toString?.().includes('WebSocket'))
        ) {
          e.preventDefault();
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
